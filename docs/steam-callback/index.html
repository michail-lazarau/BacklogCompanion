<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Redirecting...</title></head>
<body>
<script>
  // Forward Steam OpenID callback params to the app's deep link scheme.
  // Steam redirects here after login; this page immediately redirects to
  // backlogcompanion://auth/callback preserving all openid.* query params.
  var search = window.location.search;
  window.location.replace('backlogcompanion://auth/callback' + search);
</script>
</body>
</html>
